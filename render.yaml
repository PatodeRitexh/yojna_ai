services:
  - type: web
    name: yojana-ai-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: PROJECT_NAME
        value: "Yojana AI — Smart Government Scheme Finder"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: DATABASE_URL
        value: "sqlite:///./yojana_ai.db"
      - key: ADMIN_EMAIL
        value: "admin@yojanaai.gov.in"
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: static
    name: yojana-ai-frontend
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
